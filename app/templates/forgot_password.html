{% extends "base.html" %}
{% block title %}Quên mật khẩu - debugs.click{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="bg-gradient-primary p-4 text-white">
                    <div class="text-center">
                        <div class="w-20 h-20 bg-white bg-opacity-20 rounded-circle d-inline-flex align-items-center justify-content-center mx-auto mb-3">
                            <i class="fas fa-key fs-2"></i>
                        </div>
                        <h4 class="mb-1">Quên mật khẩu</h4>
                        <p class="mb-0 opacity-75">Nhập email để nhận hướng dẫn khôi phục</p>
                    </div>
                </div>
                <div class="p-4">
                    <form method="POST" action="{{ url_for('recover.forgot_password') }}" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope me-1"></i>Email
                            </label>
                            <input
                                type="email"
                                class="form-control form-control-lg border-2"
                                id="email"
                                name="email"
                                placeholder="example@email.com"
                                required
                                autofocus
                            >
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-paper-plane me-2"></i>Gửi hướng dẫn
                        </button>
                    </form>
                    <hr>
                    <div class="text-center">
                        <p class="text-muted mb-0">
                            Nhớ mật khẩu?
                            <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">
                                Đăng nhập
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
