{% extends "base.html" %}
{% block title %}Đăng nhập - debugs.click{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="bg-gradient-primary p-4 text-white">
                    <div class="text-center">
                        <div class="w-20 h-20 bg-white bg-opacity-20 rounded-circle d-inline-flex align-items-center justify-content-center mx-auto mb-3">
                            <i class="fas fa-sign-in-alt fs-2"></i>
                        </div>
                        <h4 class="mb-1">Đăng nhập</h4>
                        <p class="mb-0 opacity-75">Truy cập vào tài khoản của bạn</p>
                    </div>
                </div>
                <div class="p-4">
                    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope me-1"></i> Email
                            </label>
                            <input
                                type="email"
                                class="form-control form-control-lg border-2"
                                id="email"
                                name="email"
                                placeholder="example@email.com"
                                required
                                autofocus
                            >
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock me-1"></i> Mật khẩu
                            </label>
                            <input
                                type="password"
                                class="form-control form-control-lg border-2"
                                id="password"
                                name="password"
                                placeholder="Nhập mật khẩu của bạn"
                                required
                            >
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="remember"
                                    name="remember"
                                >
                                <label class="form-check-label text-muted" for="remember">
                                    Ghi nhớ đăng nhập
                                </label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
                        </button>
                    </form>
                    <hr>
                    <div class="text-center">
                        <p class="text-muted mb-2">
                            Quên mật khẩu?
                            <a href="{{ url_for('recover.forgot_password') }}" class="text-primary fw-semibold">
                                <i class="fas fa-question-circle me-1"></i>Đặt lại ngay
                            </a>
                        </p>
                        <p class="mb-2">
                            Chưa có tài khoản?
                            <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold">
                                Đăng ký
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
