{% extends "base.html" %}
{% block title %}Đổi email - debugs.click{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="bg-gradient-primary p-4 text-white">
                    <div class="text-center">
                        <div class="w-20 h-20 bg-white bg-opacity-20 rounded-circle d-inline-flex align-items-center justify-content-center mx-auto mb-3">
                            <i class="fas fa-envelope fs-2"></i>
                        </div>
                        <h4 class="mb-1">Đổi email</h4>
                        <p class="mb-0 opacity-75">Cập nhật địa chỉ email liên kết với tài khoản</p>
                    </div>
                </div>
                <div class="p-4">
                    <form method="POST" action="{{ url_for('account.change_email') }}" novalidate>
                        <div class="mb-3">
                            <label for="new_email" class="form-label">
                                <i class="fas fa-envelope me-1"></i>Email mới
                            </label>
                            <input
                                type="email"
                                class="form-control form-control-lg border-2"
                                id="new_email"
                                name="new_email"
                                required
                                placeholder="example@email.com"
                            >
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock me-1"></i>Mật khẩu hiện tại
                            </label>
                            <input
                                type="password"
                                class="form-control form-control-lg border-2"
                                id="password"
                                name="password"
                                required
                            >
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save me-2"></i>Lưu thay đổi
                            </button>
                            <a href="{{ url_for('account.profile') }}" class="btn btn-outline-secondary">
                                Hủy
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
