{% extends "base.html" %}
{% block title %}Đổi mật khẩu - debugs.click{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="bg-gradient-primary p-4 text-white">
                    <div class="text-center">
                        <div class="w-20 h-20 bg-white bg-opacity-20 rounded-circle d-inline-flex align-items-center justify-content-center mx-auto mb-3">
                            <i class="fas fa-key fs-2"></i>
                        </div>
                        <h4 class="mb-1">Đổi mật khẩu</h4>
                        <p class="mb-0 opacity-75">Cập nhật mật khẩu an toàn cho tài khoản của bạn</p>
                    </div>
                </div>
                <div class="p-4">
                    <form method="POST" action="{{ url_for('account.change_password') }}" novalidate>
                        <div class="mb-3">
                            <label for="current_password" class="form-label">
                                <i class="fas fa-lock me-1"></i>Mật khẩu hiện tại
                            </label>
                            <input
                                type="password"
                                class="form-control form-control-lg border-2"
                                id="current_password"
                                name="current_password"
                                required
                                autofocus
                            >
                        </div>
                        <div class="mb-3">
                            <label for="new_password" class="form-label">
                                <i class="fas fa-key me-1"></i>Mật khẩu mới
                            </label>
                            <input
                                type="password"
                                class="form-control form-control-lg border-2"
                                id="new_password"
                                name="new_password"
                                required
                                minlength="8"
                                placeholder="Ít nhất 8 ký tự: chữ hoa, chữ thường, số, ký tự đặc biệt"
                            >
                            <div class="invalid-feedback">
                                Mật khẩu phải có: 8+ ký tự, chữ hoa, chữ thường, số, ký tự đặc biệt
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">
                                <i class="fas fa-check-circle me-1"></i>Xác nhận mật khẩu
                            </label>
                            <input
                                type="password"
                                class="form-control form-control-lg border-2"
                                id="confirm_password"
                                name="confirm_password"
                                required
                                minlength="8"
                            >
                            <div class="invalid-feedback">
                                Vui lòng xác nhận mật khẩu
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save me-2"></i>Lưu thay đổi
                            </button>
                            <a href="{{ url_for('account.profile') }}" class="btn btn-outline-secondary">
                                Hủy
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
